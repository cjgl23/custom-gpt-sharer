name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-tests:
    name: syntax-and-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      # Intentionally do not run `npm test`: its existing script launches
      # browser-based GPT sharing automation, unsuitable for unattended CI.
      - name: Syntax check
        run: |
          node --check share.js
          for file in src/*.js scripts/*.js; do node --check "$file"; done
      - name: Local-only security tests
        run: node --test tests/security.test.js
